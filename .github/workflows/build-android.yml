name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install dependencies
      run: npm install

    # 5. בונה את אפליקציית ה-Web
    - name: Build Web App
      run: npm run build
      env:        
        VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        VITE_APP_ENTRY_CODE: ${{ secrets.VITE_APP_ENTRY_CODE }}

    # 5.5 --- התוספת החדשה: דוחס את העיצוב (תיקיית dist) לקובץ ZIP ---
    - name: Create OTA Update Zip
      run: cd dist && zip -r ../update.zip .

    # 6. מעביר את קבצי האתר לתוך תיקיית האנדרואיד
    - name: Sync Capacitor
      run: npx cap sync android

    # 7. מפענח את קובץ החתימה הסודי שלך מתוך גיטהאב
    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo $ENCODED_STRING | base64 -d > android/my-release-key.keystore

    # 8. מקמפל את אפליקציית האנדרואיד וחותם עליה
    - name: Build and Sign Release APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.storeFile=my-release-key.keystore \
          -Pandroid.injected.signing.storePassword=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.keyAlias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.keyPassword=${{ secrets.KEY_PASSWORD }}

    # 9. מעלה את קובץ ה-APK המוכן כ-Artifact
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: streamify-app-release.apk
        path: android/app/build/outputs/apk/release/app-release.apk

    # 10. מעדכן את ה-Release הקיים ודורס (מוחק) את הקבצים הישנים!
    - name: Create Dynamic Release
      uses: ncipollo/release-action@v1
      with:
        tag: "v1.0.${{ github.run_number }}"
        name: "Streamify v1.0.${{ github.run_number }}"
        makeLatest: true
        allowUpdates: true
        artifacts: "android/app/build/outputs/apk/release/app-release.apk,update.zip"
        token: ${{ secrets.GITHUB_TOKEN }}