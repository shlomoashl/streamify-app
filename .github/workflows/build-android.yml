name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # הוספת fetch-depth: 0 כדי שיוכל לספור את הקומיטים בהיסטוריה
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install dependencies
      run: npm install

    # 5. בונה את אפליקציית ה-Web
    - name: Build Web App
      run: npm run build
      env:        
        VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        VITE_APP_ENTRY_CODE: ${{ secrets.VITE_APP_ENTRY_CODE }}

    # 5.5 --- התוספת החדשה: דוחס את העיצוב (תיקיית dist) לקובץ ZIP ---
    - name: Create OTA Update Zip
      run: |
        cd dist
        zip -r ../update.zip *
        
    # 6. מעביר את קבצי האתר לתוך תיקיית האנדרואיד
    - name: Sync Capacitor
      run: npx cap sync android

    # 7. מפענח את קובץ החתימה הסודי שלך מתוך גיטהאב
    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo $ENCODED_STRING | base64 -d > android/my-release-key.keystore

    # 8. מקמפל את אפליקציית האנדרואיד וחותם עליה
    - name: Build and Sign Release APK
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.storeFile=my-release-key.keystore \
          -Pandroid.injected.signing.storePassword=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.keyAlias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.keyPassword=${{ secrets.KEY_PASSWORD }}

    # 9. מעלה את קובץ ה-APK המוכן כ-Artifact
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: streamify-app-release.apk
        path: android/app/build/outputs/apk/release/app-release.apk

    # יצירת הגרסה המשותפת המבוססת על package.json וספירת הקומיטים
    - name: Generate Shared Version Tag
      run: |
        COMMIT_COUNT=$(git rev-list --count HEAD)
        BASE_VERSION=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
        echo "NEW_VERSION=v${BASE_VERSION}.${COMMIT_COUNT}" >> $GITHUB_ENV

    # 10. יוצר Release חדש או מעדכן את הקיים באותו תג בדיוק כמו בווינדוס
    - name: Update Release and Overwrite Artifacts
      uses: ncipollo/release-action@v1
      with:
        tag: "${{ env.NEW_VERSION }}"
        name: "Streamify ${{ env.NEW_VERSION }}"
        makeLatest: true
        allowUpdates: true
        replacesArtifacts: true
        artifacts: "android/app/build/outputs/apk/release/app-release.apk,update.zip"
        token: ${{ secrets.GITHUB_TOKEN }}