name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: npm install

    # יצירת סקריפט עם סיומת .cjs
    - name: Prepare Version Bump Script
      shell: bash
      run: |
        cat << 'EOF' > bump-version.cjs
        const fs = require('fs');
        
        // 1. קריאה ועדכון package.json
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        let [major, minor, patch] = pkg.version.split('.').map(Number);
        patch += 1;
        const newVersion = major + '.' + minor + '.' + patch;
        pkg.version = newVersion;
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
        
        // 2. קריאה ועדכון src-tauri/tauri.conf.json
        const tauriPath = 'src-tauri/tauri.conf.json';
        if (fs.existsSync(tauriPath)) {
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.package.version = newVersion;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2));
          console.log('Successfully bumped version to ' + newVersion);
        } else {
          console.log('Warning: tauri.conf.json not found');
        }
        EOF

    # הרצת הסקריפט המתוקן
    - name: Execute Version Bump
      run: node bump-version.cjs

    - name: Commit and Push Version Bump
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add package.json src-tauri/tauri.conf.json
        git diff --quiet && git diff --staged --quiet || git commit -m "chore: bump windows version [skip ci]"
        git push

    - name: Build Tauri Windows App
      run: npm run build:windows
      env:
        VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        VITE_APP_ENTRY_CODE: ${{ secrets.VITE_APP_ENTRY_CODE }}
        TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

    # יצירת סקריפט latest עם סיומת .cjs
    - name: Generate latest.json for Updater
      shell: bash
      run: |
        cat << 'EOF' > generate-latest.cjs
        const fs = require('fs');
        const path = require('path');
        const { version } = require('./package.json');
        
        let sigContent = '', zipName = '';
        const dirs = ['./src-tauri/target/release/bundle/nsis', './src-tauri/target/release/bundle/msi'];
        
        for (const dir of dirs) {
            if (fs.existsSync(dir)) {
                const sigFile = fs.readdirSync(dir).find(f => f.endsWith('.zip.sig'));
                if (sigFile) {
                    sigContent = fs.readFileSync(path.join(dir, sigFile), 'utf8').trim();
                    zipName = sigFile.replace('.sig', '');
                    break;
                }
            }
        }
        
        const latest = {
            version: version,
            notes: 'עדכון אוטומטי חדש זמין!',
            pub_date: new Date().toISOString(),
            platforms: {
                'windows-x86_64': {
                    signature: sigContent,
                    url: 'https://github.com/shlomoashl/streamify-app/releases/download/latest-build/' + zipName
                }
            }
        };
        
        fs.writeFileSync('latest.json', JSON.stringify(latest, null, 2));
        console.log('Generated latest.json for version ' + version);
        EOF

    # הרצת הסקריפט המתוקן
    - name: Execute Latest JSON Generation
      run: node generate-latest.cjs

    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: streamify-windows
        path: src-tauri/target/release/bundle/

    - name: Create GitHub Release and Upload Windows App
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest-build
        name: Streamify (Latest Auto-Build)
        files: |
          latest.json
          src-tauri/target/release/bundle/msi/*.msi
          src-tauri/target/release/bundle/msi/*.zip
          src-tauri/target/release/bundle/msi/*.sig
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/bundle/nsis/*.zip
          src-tauri/target/release/bundle/nsis/*.sig