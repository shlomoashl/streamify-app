name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    # 1. מוריד את הקוד לשרת הווינדוס
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. מתקין Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. מתקין את שפת Rust
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    # 4. מתקין את כל הספריות של הפרויקט
    - name: Install dependencies
      run: npm install

    # 5. יצירת והרצת הגרסה הדינמית (משתמש במספר הריצה של גיטהאב בלי לשמור חזרה לגיט!)
    - name: Generate and Execute Dynamic Version
      shell: bash
      env:
        RUN_NUMBER: ${{ github.run_number }}
      run: |
        cat << 'EOF' > bump-version.cjs
        const fs = require('fs');
        const runNumber = process.env.RUN_NUMBER;
        
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        let [major, minor] = pkg.version.split('.').map(Number);
        
        // מחבר את גרסת הבסיס (למשל 1.1) עם מספר הריצה הנוכחי בגיטהאב
        const newVersion = major + '.' + minor + '.' + runNumber;
        
        pkg.version = newVersion;
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
        
        const tauriPath = 'src-tauri/tauri.conf.json';
        if (fs.existsSync(tauriPath)) {
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.package.version = newVersion;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2));
        }
        
        const envFile = process.env.GITHUB_ENV;
        if (envFile) {
          fs.appendFileSync(envFile, `NEW_VERSION=v${newVersion}\n`);
        }
        console.log('Dynamic version generated for this build: ' + newVersion);
        EOF
        node bump-version.cjs

    # 6. מקמפל את אפליקציית הווינדוס ומחתים אותה עבור ה-Updater
    - name: Build Tauri Windows App
      run: npx @tauri-apps/cli@1 build --verbose
      env:
        VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        VITE_APP_ENTRY_CODE: ${{ secrets.VITE_APP_ENTRY_CODE }}
        TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
    - name: Show all generated files
      shell: pwsh
      run: |
        Get-ChildItem src-tauri/target/release -Recurse
    - name: Show bundle files
      shell: pwsh
      run: |
        Get-ChildItem src-tauri/target/release/bundle -Recurse

    - name: Show target updater files
      shell: pwsh
      run: |
        Get-ChildItem src-tauri/target/release -Recurse | Where-Object {
          $_.Name -like "*.sig" -or
          $_.Name -like "*.zip" -or
          $_.Name -like "*updater*"
        }
    - name: Verify signing secrets
      shell: pwsh
      env:
        TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      run: |
        Write-Host "PRIVATE KEY LENGTH: $($env:TAURI_PRIVATE_KEY.Length)"
        Write-Host "PASSWORD LENGTH: $($env:TAURI_KEY_PASSWORD.Length)"
    # 7. מייצר את קובץ ה-latest.json שמכיל את נתוני העדכון והחתימה הדיגיטלית
    - name: Skip latest.json for debugging
      run: echo "Skipping latest.json generation"
