    # 8. מעלה את קובץ ההתקנה כ-Artifact לגיבוי רגיל במערכת של GitHub Actions
    - name: Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: streamify-windows
        path: src-tauri/target/release/bundle/

    # 9. יוצר Release רשמי בגיטהאב עם מספר ה-TAG העולה ומעלה אליו את כל הקבצים הנדרשים
    - name: Create GitHub Release and Upload Windows App
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.NEW_VERSION }}
        name: Streamify ${{ env.NEW_VERSION }}
        files: |
          latest.json
          src-tauri/target/release/bundle/msi/*.msi
          src-tauri/target/release/bundle/msi/*.zip
          src-tauri/target/release/bundle/msi/*.sig
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/bundle/nsis/*.zip
          src-tauri/target/release/bundle/nsis/*.sig